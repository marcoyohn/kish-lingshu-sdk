[package]
name = "kish-lingshu-runtime-contract"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
test-support = []
service-transport = ["kish-lingshu-foundation-contract/service-transport", "kish-lingshu-event-dispatch-contract/service-transport"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
kish-lingshu-foundation-contract = { workspace = true }
kish-lingshu-event-dispatch-contract = { workspace = true }

[dev-dependencies]
