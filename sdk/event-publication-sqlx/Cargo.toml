[package]
name = "kish-lingshu-event-publication-sqlx"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SQLx producer journal for reliable Kish Lingshu Event Dispatch publication"

[features]
default = ["mysql", "sqlite"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
kish-lingshu-sdk = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate"] }

[dev-dependencies]
kish-lingshu-foundation-contract = { workspace = true }
tokio = { workspace = true }
